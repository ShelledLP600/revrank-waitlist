<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply to Sponsor RevRank</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #E8271A;
    --red-dark: #B01E12;
    --red-glow: rgba(232, 39, 26, 0.15);
    --black: #0A0A0A;
    --surface: #111111;
    --surface2: #1A1A1A;
    --border: rgba(255,255,255,0.08);
    --text: #F0EDE8;
    --muted: #888580;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 300;
    line-height: 1.6;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.6;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 1.25rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(12px);
  }

  .nav-left { display: flex; align-items: center; gap: 2.5rem; }

  .logo {
    font-family: var(--font-display);
    font-size: 1.6rem;
    letter-spacing: 0.08em;
    color: var(--text);
    text-decoration: none;
  }

  .logo span { color: var(--red); }

  .nav-link {
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    font-weight: 400;
    transition: color 0.2s;
  }

  .nav-link:hover { color: var(--text); }
  .nav-link.active { color: var(--red); }

  .nav-cta {
    background: var(--red);
    color: white;
    border: none;
    padding: 0.5rem 1.25rem;
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    text-transform: uppercase;
    text-decoration: none;
    transition: background 0.2s;
  }

  .nav-cta:hover { background: var(--red-dark); }

  /* PAGE */
  .apply-page {
    max-width: 600px;
    margin: 0 auto;
    padding: 10rem 2rem 6rem;
  }

  .apply-page h1 {
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 6vw, 4rem);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    line-height: 1;
  }

  .apply-page h1 .accent { color: var(--red); }

  .apply-sub {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 3rem;
  }

  /* FORM */
  .apply-form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .form-group { display: flex; flex-direction: column; gap: 0.4rem; }

  .form-group label {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.9rem 1.25rem;
    font-family: var(--font-body);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }

  .form-group input::placeholder,
  .form-group textarea::placeholder { color: var(--muted); }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--red); }

  .form-group select {
    cursor: pointer;
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5l5 5 5-5' stroke='%23888580' fill='none' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 1.25rem center;
    padding-right: 3rem;
  }

  .form-group select option {
    background: var(--surface);
    color: var(--text);
  }

  .form-group textarea {
    resize: vertical;
    min-height: 120px;
  }

  .submit-btn {
    background: var(--red);
    color: white;
    border: 1px solid var(--red);
    padding: 1rem 2rem;
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    width: 100%;
  }

  .submit-btn:hover { background: var(--red-dark); border-color: var(--red-dark); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .success-msg {
    display: none;
    padding: 1.5rem;
    background: rgba(40, 180, 100, 0.1);
    border: 1px solid rgba(40, 180, 100, 0.3);
    color: #4fcc82;
    font-size: 0.95rem;
    line-height: 1.6;
  }

  .error-msg {
    display: none;
    padding: 1rem 1.25rem;
    background: rgba(232, 39, 26, 0.1);
    border: 1px solid rgba(232, 39, 26, 0.3);
    color: var(--red);
    font-size: 0.9rem;
  }

  /* FOOTER */
  footer {
    padding: 2rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--muted);
    max-width: 1200px;
    margin: 0 auto;
  }

  @media (max-width: 600px) {
    .nav-link { display: none; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="index.html" class="logo">Rev<span>Rank</span></a>
    <a href="sponsors.html" class="nav-link active">Sponsors</a>
  </div>
  <a href="sponsors-apply.html" class="nav-cta">Become a Sponsor</a>
</nav>

<main class="apply-page">
  <h1>Become a <span class="accent">Sponsor.</span></h1>
  <p class="apply-sub">Tell us about your brand and we'll reach out with next steps.</p>

  <form class="apply-form" id="apply-form" onsubmit="handleApply(event)">
    <div class="form-group">
      <label for="company_name">Company Name</label>
      <input type="text" id="company_name" name="company_name" placeholder="Acme Performance Parts" required>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" required>
    </div>

    <div class="form-group">
      <label for="tier">Sponsorship Tier</label>
      <select id="tier" name="tier" required>
        <option value="" disabled selected>Select a tier</option>
        <option value="ignition">Ignition</option>
        <option value="apex">Apex</option>
        <option value="redline">Redline</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Tell us about your brand and what you're looking to achieve..."></textarea>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <button type="submit" class="submit-btn" id="submit-btn">Submit Application</button>
  </form>

  <div class="success-msg" id="success-msg">
    <strong>Application received.</strong><br>
    We'll review your submission and get back to you within a few business days. Keep an eye on your inbox.
  </div>
</main>

<footer>
  <a href="index.html" class="logo" style="font-size: 1.1rem; text-decoration: none;">Rev<span style="color: var(--red);">Rank</span></a>
  <span>&copy; 2026 RevRank. Coming soon.</span>
</footer>

<script>
  // TODO: Replace with your Supabase project URL and anon key
  const SUPABASE_URL = 'https://gwsgonbkymbemwnvdzdn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3c2dvbmJreW1iZW13bnZkemRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1NDIwNTgsImV4cCI6MjA5MDExODA1OH0.fHfm5H2inKk39ae5FTFxthkZA9-57pJ3fGgSC-OcMrY';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function handleApply(e) {
    e.preventDefault();

    const btn = document.getElementById('submit-btn');
    const form = document.getElementById('apply-form');
    const successMsg = document.getElementById('success-msg');
    const errorMsg = document.getElementById('error-msg');

    const company_name = document.getElementById('company_name').value.trim();
    const email = document.getElementById('email').value.trim();
    const tier = document.getElementById('tier').value;
    const message = document.getElementById('message').value.trim();

    btn.textContent = 'Submitting...';
    btn.disabled = true;
    errorMsg.style.display = 'none';

    try {
      const { error } = await supabaseClient
        .from('sponsor_applications')
        .insert([{ company_name, email, tier, message }]);

      if (error) throw error;

      form.style.display = 'none';
      successMsg.style.display = 'block';
    } catch (err) {
      errorMsg.textContent = 'Something went wrong. Please try again or email us directly.';
      errorMsg.style.display = 'block';
      btn.textContent = 'Submit Application';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
